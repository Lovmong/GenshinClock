<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>原神 调整时间星盘</title>
  <link rel="stylesheet" href="./index.css">
</head>

<body>
  <div class="clock-wrap">
    <!-- <div class="dot"></div> -->
    <!-- 昼夜遮罩 -->
    <!-- <div class="mask-layer" id="mask" style="--maskDeg: 180deg;"></div> -->

    <!-- <img class="ref_clock" src="./assets/MainClock.png" alt="clock-bg"> -->
    <!-- <img class="ref_clock" src="./assets/xxxxxx.jpg" alt="clock-bg"> -->

    <!-- 表盘 -->
    <img class="clock-bg-bg" src="./assets/qiqi.jpg" alt="clock-bg">
    <!-- <img class="clock-bg-bg" src="./assets/111.png" alt="clock-bg"> -->
    <!-- <img class="clock-bg-bg" src="./assets/222.png" alt="clock-bg"> -->

    <img class="clock-bg" src="./assets/Clock_BG.png" alt="clock-bg">
    <img class="clock-dial" src="./assets/UI_Clock_Dial.png" alt="clock-bg">

    <!-- 表机芯-->
    <div class="clock-movement">
      <!-- 星空-->
      <!-- <img class="star" src="./assets/UI_Img_HoroscopeBg.png" alt="star"> -->
      <!-- <img class="star_particles" src="./assets/star_particles.gif" alt="star_particles"> -->
    
      <!-- 齿轮 -->
      <img class="gear3" src="./assets/UI_Img_Horoscope03.png" alt="gear3">
      <img class="gear4" src="./assets/UI_Img_Horoscope04.png" alt="gear4">
      <img class="gear5" src="./assets/UI_Img_Horoscope05.png" alt="gear5">
      <img class="gear6" src="./assets/UI_Img_Horoscope06.png" alt="gear6">
      <img class="gear7" src="./assets/UI_Img_Horoscope06.png" alt="gear7">
      <img class="gear0" src="./assets/UI_Img_Horoscope06.png" alt="gear0">

    </div>

    <!-- 指针 -->
    <img id="pointerHour" class="pointerHour" src="./assets/UI_Clock_HourHand.png" alt="hour">
    <img id="pointerMin" class="pointerMin" src="./assets/UI_Clock_MinuteHand.png" alt="minute">
    <img id="pointerSec" class="pointerSec" src="./assets/UI_Clock_SecondHand.png" alt="minute">
  
  </div>

  <script>
    const hourHand = document.getElementById('pointerHour');
    const minHand = document.getElementById('pointerMin');
    const secHand = document.getElementById('pointerSec');

    // 是否 24 小时制走一圈（原神星盘是 24 小时刻度）
    const USE_24H = false;

    function render() {
      const now = new Date();
      // console.log(now);

      // 毫秒级时间，秒针平滑扫动
      const ms = now.getMilliseconds();
      const s = now.getSeconds() + ms / 1000;         // 0 ~ 59.999
      const m = now.getMinutes() + s / 60;            // 0 ~ 59.999
      const h = (now.getHours() % (USE_24H ? 24 : 12)) + m / 60;

      // console.log(h, m, s);

      
      const secDeg = s * (360 / 60);                  // 秒针：每秒 6°
      const minDeg = m * (360 / 60);                  // 分针：每分钟 6°
      const hourDeg = 180 + h * (360 / (USE_24H ? 24 : 12));// 时针：每小时 30°（24h 制为 15°）

      secHand.style.transform = `translate(-50%, -50%) rotate(${secDeg}deg)`;
      minHand.style.transform = `translate(-50%, -50%) rotate(${minDeg}deg)`;
      hourHand.style.transform = `translate(-50%, -50%) rotate(${hourDeg}deg)`;

    }

    // 用 requestAnimationFrame 驱动，指针走动平滑
    function tick() {
      render();
      requestAnimationFrame(tick);
    }

    render();               // 初始化立刻按系统时间摆好指针
    requestAnimationFrame(tick);
  </script>

</body>

</html>
